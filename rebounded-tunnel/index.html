<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>AVENGIS Rebounded Endless Run</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{display:grid;place-items:center}
    video{display:block;width:100vw;height:100vh;object-fit:cover;background:#000;image-rendering:pixelated}
  </style>
  <script>window.__avenPrismaticParts=[];</script>
  <script src="tunnel-parts/video-part-01.js"></script>
  <script src="tunnel-parts/video-part-02.js"></script>
  <script src="tunnel-parts/video-part-03.js"></script>
  <script src="tunnel-parts/video-part-04.js"></script>
  <script src="tunnel-parts/video-part-05.js"></script>
  <script src="tunnel-parts/video-part-06.js"></script>
  <script src="tunnel-parts/video-part-07.js"></script>
  <script src="tunnel-parts/video-part-08.js"></script>
  <script src="tunnel-parts/video-part-09.js"></script>
  <script src="tunnel-parts/video-part-10.js"></script>
  <script src="tunnel-parts/video-part-11.js"></script>
  <script src="tunnel-parts/video-part-12.js"></script>
  <script src="tunnel-parts/video-part-13.js"></script>
  <script src="tunnel-parts/video-part-14.js"></script>
  <script src="tunnel-parts/video-part-15.js"></script>
  <script src="tunnel-parts/video-part-16.js"></script>
</head>
<body>
  <video id="tunnel" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
  <script>
    (function(){
      var video=document.getElementById("tunnel"), payload=window.__avenPrismaticParts.join("");
      window.__avenPrismaticParts.length=0; video.muted=true; video.defaultMuted=true; video.setAttribute("muted","");
      function start(){if(!video.paused)return;var p=video.play();if(p&&p.catch)p.catch(function(){});}
      video.addEventListener("loadeddata",start); video.addEventListener("canplay",start);
      video.addEventListener("stalled",start); window.addEventListener("pageshow",start);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)start();});
      video.src="data:video/webm;base64,"+payload; video.load(); start(); window.setInterval(start,3000);
    }());
  </script>
</body>
</html>
