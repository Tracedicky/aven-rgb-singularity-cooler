<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Aven Prismatic Core Cooler</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    body{display:grid;place-items:center}
    video{display:block;width:100vw;height:100vh;object-fit:cover;background:#000}
  </style>
  <script>window.__avenPrismaticParts=[];</script>
  <script src="singularity-v4-1/video-v7-part-01.js"></script>
  <script src="singularity-v4-1/video-v7-part-02.js"></script>
  <script src="singularity-v4-1/video-v7-part-03.js"></script>
  <script src="singularity-v4-1/video-v7-part-04.js"></script>
</head>
<body>
  <video id="prismatic" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
  <script>
    (function () {
      var video = document.getElementById("prismatic");
      var encodedParts = window.__avenPrismaticParts || [];
      var blobParts = [];

      for (var p = 0; p < encodedParts.length; p += 1) {
        var binary = window.atob(encodedParts[p]);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        blobParts.push(bytes);
      }

      window.__avenPrismaticParts = [];
      video.muted = true;
      video.setAttribute("muted", "");
      video.src = URL.createObjectURL(new Blob(blobParts, {type: "video/mp4"}));

      function start() {
        var attempt = video.play();
        if (attempt && attempt.catch) attempt.catch(function () {});
      }

      video.addEventListener("canplay", start, {once: true});
      window.addEventListener("pageshow", start);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) start();
      });
      video.load();
      window.setTimeout(start, 250);
    }());
  </script>
</body>
</html>
