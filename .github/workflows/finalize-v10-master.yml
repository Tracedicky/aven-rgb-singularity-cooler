name: Finalize V10 Crystal Focus masters

on:
  push:
    paths:
      - staging-v10/**

permissions:
  contents: write

jobs:
  finalize-v10:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V10 package
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild binary masters
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re

          staging = pathlib.Path("staging-v10")
          mp4_parts = sorted(staging.glob("master-part-*.txt"))
          if not mp4_parts:
              raise SystemExit("No staged V10 MP4 parts found")
          mp4_payload = "".join(path.read_text(encoding="ascii").strip() for path in mp4_parts)
          pathlib.Path("Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4").write_bytes(
              base64.b64decode(mp4_payload)
          )

          webm_parts = sorted(pathlib.Path("singularity-v4-1").glob("video-v10-part-*.js"))
          encoded = []
          for path in webm_parts:
              match = re.search(r'push\("([A-Za-z0-9+/=]+)"\)', path.read_text(encoding="utf-8"))
              if not match:
                  raise SystemExit(f"Could not decode {path}")
              encoded.append(match.group(1))
          pathlib.Path("Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.webm").write_bytes(
              base64.b64decode("".join(encoded))
          )
          PY

      - name: Verify V10 media
        shell: bash
        run: |
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4)" = "480"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4)" = "480"
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4)" = "270"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.webm)" = "vp8"

      - name: Publish binary masters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- staging-v10/master-part-*.txt
          git add -- \
            Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4 \
            Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.webm
          git commit -m "Publish V10 Crystal Focus binary masters"
          git push
