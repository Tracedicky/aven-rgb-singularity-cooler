name: Build Prismatic Core V11 Living Ribbons

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-prismatic-v11.yml

permissions:
  contents: write

jobs:
  build-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Check out V11 package
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild binary masters
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re

          staging = pathlib.Path("staging-v11")
          mp4_parts = sorted(staging.glob("master-part-*.txt"))
          if not mp4_parts:
              raise SystemExit("No staged V11 MP4 parts found")
          mp4_payload = "".join(path.read_text(encoding="ascii").strip() for path in mp4_parts)
          pathlib.Path("Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.mp4").write_bytes(
              base64.b64decode(mp4_payload)
          )

          webm_parts = sorted(pathlib.Path("singularity-v4-1").glob("video-v11-part-*.js"))
          encoded = []
          for path in webm_parts:
              match = re.search(r'push\("([A-Za-z0-9+/=]+)"\)', path.read_text(encoding="utf-8"))
              if not match:
                  raise SystemExit(f"Could not decode {path}")
              encoded.append(match.group(1))
          pathlib.Path("Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.webm").write_bytes(
              base64.b64decode("".join(encoded))
          )
          PY

      - name: Ensure ffprobe is available
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Verify V11 media
        shell: bash
        run: |
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.mp4)" = "480"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.mp4)" = "480"
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.mp4)" = "270"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.webm)" = "vp8"

      - name: Publish V11 binary masters
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- staging-v11/master-part-*.txt
          git rm -f --ignore-unmatch -- singularity-v4-1/video-v10-part-*.js
          git rm -f --ignore-unmatch -- \
            Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.mp4 \
            Aven_Prismatic_Core_Cooler_V10_Crystal_Focus_480x480.webm \
            .github/workflows/build-prismatic-v10.yml
          git add -- \
            Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.mp4 \
            Aven_Prismatic_Core_Cooler_V11_Living_Ribbons_480x480.webm
          git commit -m "Publish V11 Living Ribbons binary masters"
          git push
